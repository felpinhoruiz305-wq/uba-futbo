const SUPABASE_URL = 'https://cfqhyvxhbsudwpncalbp.supabase.co';

const db = window.supabase.createClient(

let teams = [];
let matches = [];

const $ = id => document.getElementById(id);

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[char]);
}

function formatDate(value) {
  if (!value) return 'Fecha a confirmar';
  return new Intl.DateTimeFormat('es-AR', {
    weekday:'long',
    day:'2-digit',
    month:'2-digit',
    hour:'2-digit',
    minute:'2-digit',
    timeZone:'America/Argentina/Buenos_Aires'
  }).format(new Date(value));
}

function teamName(id) {
  return teams.find(t => t.id === id)?.name || 'Equipo';
}

function matchScore(match) {
  if (match.status === 'confirmed' &&
      match.home_score !== null &&
      match.away_score !== null) {
    return `${match.home_score} – ${match.away_score}`;
  }
  return 'VS';
}

function statusLabel(status) {
  const labels = {
    confirmed:'Resultado confirmado',
    scheduled:'Programado',
    pending:'Pendiente de confirmación',
    disputed:'En revisión'
  };
  return labels[status] || 'Pendiente';
}

function renderMatch(match) {
  const home = escapeHTML(teamName(match.home_team_id));
  const away = escapeHTML(teamName(match.away_team_id));
  const confirmed = match.status === 'confirmed';

  return `
    <div class="match">
      <div style="min-width:0">
        <div class="teams">${home} <span class="muted">vs.</span> ${away}</div>
        <div class="small muted">${escapeHTML(formatDate(match.match_date))}</div>
        <div class="small">
          <span class="pill ${confirmed ? '' : 'warn'}">${escapeHTML(statusLabel(match.status))}</span>
        </div>
      </div>
      <div class="score">${escapeHTML(matchScore(match))}</div>
    </div>
  `;
}

function renderHome() {
  const confirmed = matches.filter(m => m.status === 'confirmed');
  const scheduled = matches
    .filter(m => m.status === 'scheduled' || m.status === 'pending')
    .sort((a,b) => new Date(a.match_date) - new Date(b.match_date));

  $('totalTeams').textContent = teams.length;
  $('totalZones').textContent = '4';
  $('totalResults').textContent = confirmed.length;

  if (scheduled.length) {
    $('nextMatch').innerHTML = renderMatch(scheduled[0]);
  } else {
    $('nextMatch').innerHTML = '<p class="muted small">No hay próximos partidos cargados.</p>';
  }

  const latest = [...confirmed].sort(
    (a,b) => new Date(b.match_date) - new Date(a.match_date)
  ).slice(0,4);

  $('latestResults').innerHTML = latest.length
    ? latest.map(renderMatch).join('')
    : '<p class="muted small">Todavía no hay resultados confirmados.</p>';
}

function renderFixture() {
  const ordered = [...matches].sort(
    (a,b) => new Date(a.match_date) - new Date(b.match_date)
  );

  if (!ordered.length) {
    $('fixtureContent').innerHTML = '<p class="muted">No hay partidos cargados.</p>';
    return;
  }

  const categories = [
    {name:'Categoría A',teams:teams.filter(t => t.category === 'A')},
    {name:'Categoría B',teams:teams.filter(t => t.category === 'B')}
  ];

  $('fixtureContent').innerHTML = categories.map(category => {
    const ids = category.teams.map(t => t.id);
    const categoryMatches = ordered.filter(m =>
      ids.includes(m.home_team_id) || ids.includes(m.away_team_id)
    );

    const zones = [...new Set(category.teams.map(t => t.zone))];

    return `
      <div class="card" style="margin-bottom:14px">
        <h2>${escapeHTML(category.name)}</h2>
        ${zones.map(zone => {
          const zoneIds = category.teams
            .filter(t => t.zone === zone).map(t => t.id);
          const zoneMatches = categoryMatches.filter(m =>
            zoneIds.includes(m.home_team_id) &&
            zoneIds.includes(m.away_team_id)
          );

          return `
            <div style="margin-top:16px">
              <h3 style="font-size:14px">
                ${category.name === 'Categoría B' ? 'Zona única' : 'Zona ' + escapeHTML(zone)}
              </h3>
              ${zoneMatches.length
                ? zoneMatches.map(renderMatch).join('')
                : '<p class="muted small">Todavía no hay partidos cargados para esta zona.</p>'}
            </div>
          `;
        }).join('')}
      </div>
    `;
  }).join('');
}

function calculateStandings(zoneTeams, zoneMatches) {
  const table = zoneTeams.map(team => ({
    id:team.id,
    name:team.name,
    pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0
  }));

  zoneMatches
    .filter(m => m.status === 'confirmed' &&
      m.home_score !== null && m.away_score !== null)
    .forEach(match => {
      const home = table.find(t => t.id === match.home_team_id);
      const away = table.find(t => t.id === match.away_team_id);
      if (!home || !away) return;

      const hg = Number(match.home_score);
      const ag = Number(match.away_score);

      home.pj++; away.pj++;
      home.gf += hg; home.gc += ag;
      away.gf += ag; away.gc += hg;

      if (hg > ag) {
        home.pg++; away.pp++; home.pts += 3;
      } else if (hg < ag) {
        away.pg++; home.pp++; away.pts += 3;
      } else {
        home.pe++; away.pe++;
        home.pts++; away.pts++;
      }
    });

  return table.sort((a,b) =>
    b.pts - a.pts ||
    (b.gf-b.gc) - (a.gf-a.gc) ||
    a.name.localeCompare(b.name,'es')
  );
}

function standingsTable(rows) {
  return `
    <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>#</th><th>Equipo</th>
          <th class="num">PJ</th><th class="num">PG</th>
          <th class="num">PE</th><th class="num">PP</th>
          <th class="num">GF</th><th class="num">GC</th>
          <th class="num">DG</th><th class="num">Pts</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map((t,i) => `
          <tr>
            <td>${i+1}</td>
            <td class="teamcell">${escapeHTML(t.name)}</td>
            <td class="num">${t.pj}</td>
            <td class="num">${t.pg}</td>
            <td class="num">${t.pe}</td>
            <td class="num">${t.pp}</td>
            <td class="num">${t.gf}</td>
            <td class="num">${t.gc}</td>
            <td class="num">${t.gf-t.gc > 0 ? '+' : ''}${t.gf-t.gc}</td>
            <td class="num"><b>${t.pts}</b></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    </div>
  `;
}

function renderStandings() {
  const categoryA = teams.filter(t => t.category === 'A');
  const categoryB = teams.filter(t => t.category === 'B');

  const zones = ['A','B','C'];

  const htmlA = zones.map(zone => {
    const zoneTeams = categoryA.filter(t => t.zone === zone);
    const ids = zoneTeams.map(t => t.id);
    const zoneMatches = matches.filter(m =>
      ids.includes(m.home_team_id) && ids.includes(m.away_team_id)
    );
    const rows = calculateStandings(zoneTeams, zoneMatches);

    return `
      <div class="card" style="margin-bottom:14px">
        <h2>Categoría A · Zona ${zone}</h2>
        ${standingsTable(rows)}
      </div>
    `;
  }).join('');

  const idsB = categoryB.map(t => t.id);
  const matchesB = matches.filter(m =>
    idsB.includes(m.home_team_id) && idsB.includes(m.away_team_id)
  );
  const rowsB = calculateStandings(categoryB, matchesB);

  $('standingsContent').innerHTML = htmlA + `
    <div class="card">
      <h2>Categoría B · Zona única</h2>
      ${standingsTable(rowsB)}
    </div>
    <p class="muted small">
      Desempate: puntos y diferencia de gol.
      Solo se consideran partidos confirmados.
    </p>
  `;
}

async function loadData() {
  $('connectionStatus').textContent = '● CONECTANDO';

  try {
    const [teamsResult, matchesResult] = await Promise.all([
      db.from('teams')
        .select('id,name,category,zone')
        .order('name'),
      db.from('matches')
        .select('id,home_team_id,away_team_id,match_date,round,stage,status,home_score,away_score,result_origin')
        .order('match_date')
    ]);

    if (teamsResult.error) throw teamsResult.error;
    if (matchesResult.error) throw matchesResult.error;

    teams = teamsResult.data || [];
    matches = matchesResult.data || [];

    $('connectionStatus').textContent = '● CONECTADO';
    $('connectionStatus').style.background = '#294f3a';

    renderHome();
    renderFixture();
    renderStandings();
    renderTeamOptions();

  } catch (error) {
    console.error('Error al consultar Supabase:', error);
    $('connectionStatus').textContent = '● ERROR DE CONEXIÓN';
    $('connectionStatus').style.background = '#8b3030';

    const message = `
      <div class="error">
        No se pudieron cargar los datos del torneo.
        <br><small>${escapeHTML(error.message || 'Error desconocido')}</small>
      </div>
    `;

    $('nextMatch').innerHTML = message;
    $('latestResults').innerHTML = message;
    $('fixtureContent').innerHTML = message;
    $('standingsContent').innerHTML = message;
    $('requestTeam').innerHTML = '<option value="">No se pudieron cargar los equipos</option>';
  }
}

$('logoutButton').addEventListener('click', async () => {
  await db.auth.signOut();
  currentUser = null;
  currentProfile = null;
  showPublicPortal();
});

function showPublicPortal() {
  $('dtPublic').style.display = 'block';
  $('dtAuthenticated').style.display = 'none';
}

async function checkSession() {
  const {data,error} = await db.auth.getSession();

  if (error) {
    console.error(error);
    showPublicPortal();
    return;
  }

  currentUser = data.session?.user || null;

  if (!currentUser) {
    showPublicPortal();
    return;
  }

  const {data:profile,error:profileError} = await db
    .from('profiles')
    .select('full_name,role')
    .eq('id',currentUser.id)
    .single();

  if (profileError) {
    showMessage('loginMessage','No se pudo consultar tu perfil.');
    showPublicPortal();
    return;
  }

  currentProfile = profile;

  $('dtPublic').style.display = 'none';
  $('dtAuthenticated').style.display = 'block';
  $('accountTitle').textContent = profile.full_name || 'Mi cuenta';

  if (profile.role === 'admin') {
    $('accountDescription').textContent = 'Panel de administración';
    await renderAdminPanel();

  } else if (profile.role === 'pending') {
    $('accountDescription').textContent = 'Cuenta pendiente de autorización';
    $('accountContent').innerHTML = `
      <div class="notice warn">
        Tu cuenta todavía no fue habilitada por la organización.
      </div>
    `;

  } else if (profile.role === 'dt') {
    $('accountDescription').textContent = 'Director técnico';
    await renderDTAccount();

  } else {
    $('accountDescription').textContent = 'Acceso no habilitado';
    $('accountContent').innerHTML = `
      <div class="notice warn">
        Tu perfil no tiene permisos para acceder al portal.
      </div>
    `;
  }
}

// Panel de administrador: solicitudes y partidos en revisión
async function renderAdminPanel() {
  $('accountContent').innerHTML = '<div class="loading">Cargando panel de administración...</div>';

  const [requestsResult, disputedResult] = await Promise.all([
    db.from('access_requests')
      .select('id,full_name,email,status,created_at,requested_team_id')
      .order('created_at',{ascending:false}),
    db.from('matches')
      .select('id,home_team_id,away_team_id,match_date,status,home_score,away_score')
      .eq('status','disputed')
      .order('match_date')
  ]);

  if (requestsResult.error || disputedResult.error) {
    const error = requestsResult.error || disputedResult.error;
    $('accountContent').innerHTML = `<div class="error">${escapeHTML(error.message)}</div>`;
    return;
  }

  const requests = requestsResult.data || [];
  const disputedMatches = disputedResult.data || [];
  let reports = [];
  let disputes = [];

  if (disputedMatches.length) {
    const ids = disputedMatches.map(m => m.id);
    const [reportsResult, disputesResult] = await Promise.all([
      db.from('match_reports')
        .select('match_id,team_id,home_score,away_score,submitted_by,submitted_at')
        .in('match_id',ids),
      db.from('match_disputes')
        .select('match_id,description,resolution,created_at')
        .in('match_id',ids)
    ]);

    if (reportsResult.error || disputesResult.error) {
      $('accountContent').innerHTML = `<div class="error">${escapeHTML((reportsResult.error || disputesResult.error).message)}</div>`;
      return;
    }
    reports = reportsResult.data || [];
    disputes = disputesResult.data || [];
  }

  const requestsHTML = requests.length ? requests.map(request => {
    const team = teams.find(t => t.id === request.requested_team_id);
    const teamLabel = team
      ? `${team.name} · Categoría ${team.category} · ${team.category === 'B' ? 'Zona única' : 'Zona ' + team.zone}`
      : 'Equipo no disponible';

    return `
      <div class="request">
        <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
          <b>${escapeHTML(request.full_name)}</b>
          <span class="pill ${request.status === 'pending' ? 'warn' : request.status === 'approved' ? '' : 'gray'}">${escapeHTML(request.status)}</span>
        </div>
        <div class="small muted">${escapeHTML(request.email)}</div>
        <div class="small">${escapeHTML(teamLabel)}</div>
        <div class="small muted">Solicitud: ${escapeHTML(formatDate(request.created_at))}</div>
        ${request.status === 'pending' ? `
          <div class="request-actions">
            <input id="user-${request.id}" placeholder="UUID del usuario invitado en Supabase">
            <button class="action" onclick="approveRequest('${request.id}')">Aprobar</button>
            <button class="action danger" onclick="rejectRequest('${request.id}')">Rechazar</button>
          </div>
        ` : ''}
      </div>
    `;
  }).join('') : '<p class="muted small">Todavía no hay solicitudes.</p>';

  const disputedHTML = disputedMatches.length ? disputedMatches.map(match => {
    const homeReport = reports.find(r => r.match_id === match.id && r.team_id === match.home_team_id);
    const awayReport = reports.find(r => r.match_id === match.id && r.team_id === match.away_team_id);
    const dispute = disputes.find(d => d.match_id === match.id);

    return `
      <div class="report-card">
        <b>${escapeHTML(teamName(match.home_team_id))} vs. ${escapeHTML(teamName(match.away_team_id))}</b>
        <div class="report-meta">${escapeHTML(formatDate(match.match_date))}</div>
        <div class="notice warn" style="margin-top:9px">
          Reporte de ${escapeHTML(teamName(match.home_team_id))}: <b>${homeReport ? `${homeReport.home_score}–${homeReport.away_score}` : 'Sin reporte'}</b><br>
          Reporte de ${escapeHTML(teamName(match.away_team_id))}: <b>${awayReport ? `${awayReport.home_score}–${awayReport.away_score}` : 'Sin reporte'}</b>
          ${dispute?.description ? `<br>Detalle: ${escapeHTML(dispute.description)}` : ''}
        </div>
        <div class="report-grid">
          <div class="field">
            <label for="resolve-home-${match.id}">Goles oficiales · ${escapeHTML(teamName(match.home_team_id))}</label>
            <input id="resolve-home-${match.id}" type="number" min="0" step="1" required>
          </div>
          <div class="field">
            <label for="resolve-away-${match.id}">Goles oficiales · ${escapeHTML(teamName(match.away_team_id))}</label>
            <input id="resolve-away-${match.id}" type="number" min="0" step="1" required>
          </div>
          <div class="field" style="grid-column:1/-1">
            <label for="resolve-reason-${match.id}">Fundamento de la resolución</label>
            <input id="resolve-reason-${match.id}" required maxlength="1000" placeholder="Explicá cómo se determinó el resultado oficial">
          </div>
        </div>
        <div class="report-actions">
          <button class="action" onclick="resolveDispute('${match.id}')">Publicar resultado oficial</button>
        </div>
      </div>
    `;
  }).join('') : '<p class="muted small">No hay partidos en revisión.</p>';

  $('accountContent').innerHTML = `
    <section>
      <h2>Solicitudes de acceso</h2>
      ${requestsHTML}
    </section>
    <section style="margin-top:28px">
      <h2>Partidos en revisión</h2>
      <p class="muted small">Revisá los dos reportes y establecé el resultado oficial. Esta resolución queda registrada como decisión de la organización.</p>
      ${disputedHTML}
    </section>`;
}

// Resolver una discrepancia como administrador
async function resolveDispute(matchId) {
  const homeRaw = $(`resolve-home-${matchId}`).value;
  const awayRaw = $(`resolve-away-${matchId}`).value;
  const reason = $(`resolve-reason-${matchId}`).value.trim();
  const homeScore = Number(homeRaw);
  const awayScore = Number(awayRaw);

  if (homeRaw === '' || awayRaw === '' || !Number.isInteger(homeScore) || !Number.isInteger(awayScore) || homeScore < 0 || awayScore < 0) {
    alert('Ingresá dos resultados válidos: números enteros iguales o mayores a cero.');
    return;
  }
  if (!reason) { alert('Escribí el fundamento de la resolución.'); return; }
  if (!confirm('¿Confirmás este resultado como oficial?')) return;

  const {data,error} = await db.rpc('resolve_match_dispute', {
    p_match_id:matchId,
    p_home_score:homeScore,
    p_away_score:awayScore,
    p_resolution:reason
  });
  if (error) { alert('No se pudo resolver el partido: ' + error.message); return; }
  alert(data || 'Resultado oficial publicado.');
  await loadData();
  await renderAdminPanel();
}

// Aprobar solicitud
async function approveRequest(requestId) {
  const userId = $(`user-${requestId}`).value.trim();

  if (!userId) {
    alert('Primero ingresá el UUID del usuario invitado.');
    return;
  }

  if (!confirm('¿Confirmás la aprobación y asignación del equipo?')) return;

  const {data,error} = await db.rpc('approve_access_request',{
    p_request_id:requestId,
    p_user_id:userId
  });

  if (error) {
    alert('No se pudo aprobar: ' + error.message);
    return;
  }

  alert(data);
  await renderAdminPanel();
}

// Rechazar solicitud
async function rejectRequest(requestId) {
  if (!confirm('¿Querés rechazar esta solicitud?')) return;

  const {data,error} = await db.rpc('reject_access_request',{
    p_request_id:requestId
  });

  if (error) {
    alert('No se pudo rechazar: ' + error.message);
    return;
  }

  alert(data);
  await renderAdminPanel();
}

// Cuenta de DT: partidos de su equipo, reportes y confirmaciones
async function renderDTAccount() {
  $('accountContent').innerHTML = '<div class="loading">Cargando tus partidos...</div>';
  const {data:memberships,error} = await db
    .from('team_memberships')
    .select('team_id,teams(name,category,zone)')
    .eq('user_id',currentUser.id);

  if (error) {
    $('accountContent').innerHTML = `<div class="error">${escapeHTML(error.message)}</div>`;
    return;
  }
  if (!memberships || !memberships.length) {
    $('accountContent').innerHTML = '<div class="notice warn">Tu cuenta todavía no tiene un equipo asignado.</div>';
    return;
  }

  const teamIds = memberships.map(m => m.team_id);
  const myMatches = matches.filter(m => teamIds.includes(m.home_team_id) || teamIds.includes(m.away_team_id));
  const matchIds = myMatches.map(m => m.id);
  let reports = [];
  let confirmations = [];

  if (matchIds.length) {
    const [reportsResult, confirmationsResult] = await Promise.all([
      db.from('match_reports')
        .select('match_id,team_id,home_score,away_score,submitted_by,submitted_at')
        .in('match_id',matchIds),
      db.from('match_confirmations')
        .select('match_id,team_id,confirmed_by,confirmed_at')
        .in('match_id',matchIds)
    ]);
    if (reportsResult.error || confirmationsResult.error) {
      const error = reportsResult.error || confirmationsResult.error;
      $('accountContent').innerHTML = `<div class="error">${escapeHTML(error.message)}</div>`;
      return;
    }
    reports = reportsResult.data || [];
    confirmations = confirmationsResult.data || [];
  }

  const teamCards = memberships.map(m => {
    const t = m.teams;
    return `<div class="notice" style="margin-bottom:8px"><b>${escapeHTML(t?.name || teamName(m.team_id))}</b><br>Categoría ${escapeHTML(t?.category || '—')} · ${t?.category === 'B' ? 'Zona única' : 'Zona ' + escapeHTML(t?.zone || '—')}</div>`;
  }).join('');

  const matchCards = myMatches.length ? myMatches.map(match => {
    const isHome = teamIds.includes(match.home_team_id);
    const myTeamId = isHome ? match.home_team_id : match.away_team_id;
    const opponentId = isHome ? match.away_team_id : match.home_team_id;
    const ownReport = reports.find(r => r.match_id === match.id && r.team_id === myTeamId);
    const opponentReport = reports.find(r => r.match_id === match.id && r.team_id === opponentId);
    const myConfirmation = confirmations.find(c => c.match_id === match.id && c.team_id === myTeamId);
    const opponentConfirmation = confirmations.find(c => c.match_id === match.id && c.team_id === opponentId);
    const reportsMatch = ownReport && opponentReport && ownReport.home_score === opponentReport.home_score && ownReport.away_score === opponentReport.away_score;

    let body = '';
    if (match.status === 'confirmed') {
      body = `<div class="notice">Resultado oficial: <b>${match.home_score}–${match.away_score}</b></div>`;
    } else if (match.status === 'disputed') {
      body = '<div class="notice warn">Los reportes no coinciden. El partido quedó en revisión de la organización; no se pueden realizar más cambios.</div>';
    } else if (reportsMatch) {
      body = `
        <div class="notice">Ambos DT informaron ${ownReport.home_score}–${ownReport.away_score}.<br>Tu confirmación: <b>${myConfirmation ? 'Realizada' : 'Pendiente'}</b> · Confirmación rival: <b>${opponentConfirmation ? 'Realizada' : 'Pendiente'}</b></div>
        ${!myConfirmation ? `<div class="report-actions"><button class="action" onclick="confirmMatch('${match.id}')">Confirmar resultado</button></div>` : ''}
      `;
    } else {
      const opponentText = opponentReport
        ? `El rival informó ${opponentReport.home_score}–${opponentReport.away_score}. Compará el resultado antes de enviar el tuyo.`
        : 'Todavía falta el reporte del otro equipo.';
      body = `
        ${ownReport ? `<div class="notice" style="margin-bottom:9px">Tu reporte actual: <b>${ownReport.home_score}–${ownReport.away_score}</b>. Podés corregirlo hasta confirmar.</div>` : ''}
        <div class="small muted">${escapeHTML(opponentText)}</div>
        <form class="report-grid" onsubmit="submitMatchReport(event,'${match.id}')">
          <div class="field"><label for="report-home-${match.id}">Goles ${escapeHTML(teamName(match.home_team_id))}</label><input id="report-home-${match.id}" type="number" min="0" step="1" required value="${ownReport ? ownReport.home_score : ''}"></div>
          <div class="field"><label for="report-away-${match.id}">Goles ${escapeHTML(teamName(match.away_team_id))}</label><input id="report-away-${match.id}" type="number" min="0" step="1" required value="${ownReport ? ownReport.away_score : ''}"></div>
          <div class="field" style="grid-column:1/-1"><button class="action" type="submit">${ownReport ? 'Actualizar mi reporte' : 'Enviar resultado'}</button></div>
        </form>
      `;
    }

    return `
      <div class="report-card">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap">
          <div><b>${escapeHTML(teamName(match.home_team_id))} vs. ${escapeHTML(teamName(match.away_team_id))}</b><div class="report-meta">${escapeHTML(formatDate(match.match_date))}</div></div>
          <span class="pill ${match.status === 'confirmed' ? '' : 'warn'}">${escapeHTML(statusLabel(match.status))}</span>
        </div>
        ${body}
      </div>`;
  }).join('') : '<p class="muted small">Todavía no hay partidos cargados para tu equipo.</p>';

  $('accountContent').innerHTML = `
    <h2>Mi equipo</h2>
    ${teamCards}
    <h2 style="margin-top:24px">Mis partidos</h2>
    <p class="muted small">Cada DT carga el resultado desde su cuenta. Si ambos reportes coinciden, los dos deben confirmarlo para hacerlo oficial. Si difieren, interviene la organización.</p>
    ${matchCards}`;
}

async function submitMatchReport(event, matchId) {
  event.preventDefault();
  const homeRaw = $(`report-home-${matchId}`).value;
  const awayRaw = $(`report-away-${matchId}`).value;
  const homeScore = Number(homeRaw);
  const awayScore = Number(awayRaw);
  if (homeRaw === '' || awayRaw === '' || !Number.isInteger(homeScore) || !Number.isInteger(awayScore) || homeScore < 0 || awayScore < 0) {
    alert('Ingresá dos resultados válidos: números enteros iguales o mayores a cero.');
    return;
  }
  const button = event.submitter;
  if (button) { button.disabled = true; button.textContent = 'Enviando...'; }
  const {data,error} = await db.rpc('submit_match_report', {
    p_match_id:matchId,
    p_home_score:homeScore,
    p_away_score:awayScore
  });
  if (error) {
    alert('No se pudo enviar el resultado: ' + error.message);
    if (button) { button.disabled = false; button.textContent = 'Reintentar'; }
    return;
  }
  alert(data || 'Reporte enviado.');
  await loadData();
  await renderDTAccount();
}

async function confirmMatch(matchId) {
  if (!confirm('¿Confirmás que el resultado informado por ambos equipos es correcto?')) return;
  const {data,error} = await db.rpc('confirm_match_result',{p_match_id:matchId});
  if (error) { alert('No se pudo confirmar: ' + error.message); return; }
  alert(data || 'Confirmación registrada.');
  await loadData();
  await renderDTAccount();
}

// Navegación
document.querySelectorAll('.navbtn').forEach(button => {
  button.addEventListener('click',() => {
    document.querySelectorAll('.navbtn').forEach(b =>
      b.classList.toggle('active',b === button)
    );
    document.querySelectorAll('.section').forEach(section =>
      section.classList.toggle('active',section.id === button.dataset.tab)
    );
  });
});

// Inicialización
loadData();
checkSession();

db.auth.onAuthStateChange(() => {
  setTimeout(checkSession,0);
});
</script>
